  </defs>
  <rect width='800' height='600' fill='url(#g)'/>
  <rect x='20' y='20' width='760' height='560' fill='none' stroke='rgba(255,255,255,0.1)' stroke-width='2' stroke-dasharray='8,8' rx='16'/>
  <text x='400' y='260' text-anchor='middle' font-family='Arial,sans-serif' font-weight='bold' font-size='48' fill='white' filter='url(#glow)'>Full Forking Spread</text>
  <text x='400' y='310' text-anchor='middle' font-family='Arial,sans-serif' font-size='20' fill='rgba(255,255,255,0.5)'>Serves 25-40</text>
  <text x='400' y='560' text-anchor='middle' font-family='Arial,sans-serif' font-size='14' fill='rgba(255,255,255,0.2)'>Frosted Fork · Small Cakes &amp; Sweet Treats</text>
